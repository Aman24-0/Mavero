<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06060a" />
    <!-- PWA: prefer the modern `mobile-web-app-capable` meta (the deprecation
         warning fires for `apple-mobile-web-app-capable` alone). iOS still
         needs `apple-mobile-web-app-capable` for full-screen standalone mode
         on older iOS versions, so we keep BOTH for backwards compatibility —
         newer browsers prefer the unprefixed `mobile-web-app-capable`. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAVERO" />
    <!-- SEO follow-up: the static default meta description is INTENTIONALLY
         GONE. Every public route renders its own description (Discover/
         Explorer/Detail components + route-level heads); keeping this static
         tag made EVERY page serve TWO meta descriptions (the duplicate-
         description defect). Pages without a route-specific description
         (error pages, noindex utility routes) intentionally carry none. -->
    <!-- FAVICON policy (focused favicon audit fix, 2026-10):
         Googlebot's standard favicon lookup is GET /favicon.ico at the
         site root REGARDLESS of <link rel="icon"> tags elsewhere. Without
         /favicon.ico returning a real image, Google Search renders a
         generic globe icon for the site (verified live: production
         returned the SvelteKit 404 page for /favicon.ico). A real
         multi-resolution .ico (16/32/48) is now served at
         static/favicon.ico (SvelteKit serves static/ at the site root),
         and it is declared as the explicit primary favicon below. The
         PNG favicons and apple-touch icon are preserved for the
         higher-resolution + iOS paths. Order matters: the .ico is
         listed FIRST so legacy crawlers that pick the first <link
         rel="icon"> they find select the .ico (Google's documented
         preference). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/mavero-192.png" />
    <link rel="apple-touch-icon" href="/icons/mavero-apple-touch.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- MAV-21 Workstream E — preconnect to the TMDB image CDN (the
         origin of EVERY poster/backdrop in the app). Without this, the
         browser only discovers image.tmdb.org when the first hero/rail
         <img> parses, then pays DNS + TCP + TLS (~100-300ms on mobile)
         BEFORE the LCP artwork even starts. No `crossorigin`: <img>
         loads are no-cors, so a crossorigin preconnect would open a
         connection the images never use. -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    %sveltekit.head%
    <!-- Umami Cloud analytics (Phase 1 — Setup & Script Installation;
         production-hardening round: /admin exclusion).
         The tracker is loaded by the GUARDED INLINE LOADER below, before
         hydration, on every NON-ADMIN route. Umami Cloud has no built-in
         path-exclusion UI, so the exclusion is enforced at the only two
         layers Mavero controls:
           1. HERE — the loader checks window.location.pathname and NEVER
              injects the tracker script on /admin/* URLs (first paint of
              an admin route ships zero analytics requests);
           2. src/lib/client/analytics/umami.ts — umamiTrack() early-returns
              when the SPA is currently ON an /admin path, which also covers
              client-side navigation INTO /admin after the script already
              loaded on a public route.
         `defer` semantics are preserved by injecting with defer=true, so
         the tracker stays out of the critical path and out of the LCP
         measurement. The website id is injected from the
         PUBLIC_UMAMI_WEBSITE_ID environment variable (Netlify → Site
         configuration → Environment variables) via SvelteKit's app.html
         env template placeholder — resolved from the server's public env
         on every SSR render (the placeholder is runtime-substituted, not
         build-inlined; if the variable is unset the id renders as an
         empty string).
         BUILD SAFETY (deploy breakage seen 2026-11): SvelteKit validates
         EVERY env placeholder pattern that appears anywhere in this file —
         COMMENTS AND PROSE INCLUDED — and hard-fails `vite build` and
         `svelte-kit sync` when a placeholder's variable name lacks the
         PUBLIC_ prefix ("Environment variables in src/app.html must start
         with PUBLIC_"). A generic doc example of the syntax inside this
         comment is enough to break the build; never write one — reference
         the real PUBLIC_-prefixed variable name only, as done below.
         NOTE: the plain %-wrapped env names seen in some Vite guides are
         NOT substituted by SvelteKit/Vite here (Vite's html env hook only
         covers VITE_* prefixes) and would ship a literal, broken id — the
         SvelteKit-native placeholder below is the equivalent of that
         intent. -->
    <script>
      // Umami Cloud loader — admin-route exclusion (production-hardening
      // round). Runs inline, synchronously, BEFORE hydration: on /admin
      // routes the tracker is never added to the DOM at all, so the admin
      // panel ships zero analytics network requests and Umami's website
      // stats stay limited to the user-facing app. Everything is wrapped
      // in try/catch — analytics must never break the app.
      (function () {
        try {
          if (window.location.pathname.indexOf('/admin') === 0) return;
          var umamiScript = document.createElement('script');
          umamiScript.defer = true;
          umamiScript.src = 'https://cloud.umami.is/script.js';
          umamiScript.setAttribute('data-website-id', '%sveltekit.env.PUBLIC_UMAMI_WEBSITE_ID%');
          document.head.appendChild(umamiScript);
        } catch (e) {
          /* analytics must never break the app */
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="tap">
    <!-- Production-hardening round: preload-data upgraded 'hover' → 'tap'.
         'hover' preloads on mouseenter/focus — on touch-only devices
         (the PWA's PRIMARY audience) emulated hover fires at the same
         moment as the click itself, so it buys ZERO head start and the
         router always waits for the load roundtrip. 'tap' preloads on
         pointerdown (finger DOWN), which fires 100-250ms before the
         click completes (finger up) — on mobile that head start is the
         difference between "click and it's there" and "click, wait for
         the server". Desktop still preloads (pointerdown precedes
         click there too, and focus preloading covers keyboard users). -->
    <script>
      // Newtask §6 — touch-capable Mac detection (iPad-as-Mac).
      //
      // iPads in default desktop mode ship a Macintosh User-Agent, so the
      // server cannot distinguish them from a desktop Mac by UA alone. This
      // inline script runs BEFORE hydration and sets a purely DESCRIPTIVE
      // hint cookie on the first visit; every subsequent server render
      // (including the device_sessions registry) classifies the device as
      // a tablet.
      //
      // Privacy/safety: the value is a static string ("tablet") — no PII,
      // no fingerprinting, no identifiers. It is never an authentication
      // credential and never used for access control. Cookie flags:
      // path=/, 1 year, SameSite=Lax (readable only by this origin over
      // the same-site requests the server handles).
      (function () {
        try {
          if (
            document.cookie.indexOf('mavero:device-hint=') === -1 &&
            navigator.maxTouchPoints > 1 &&
            navigator.platform === 'MacIntel'
          ) {
            document.cookie = 'mavero:device-hint=tablet; path=/; max-age=31536000; samesite=lax';
          }
        } catch (e) {
          /* descriptive only — never block rendering */
        }
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
