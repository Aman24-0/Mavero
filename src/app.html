<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06060a" />
    <!-- PWA: prefer the modern `mobile-web-app-capable` meta (the deprecation
         warning fires for `apple-mobile-web-app-capable` alone). iOS still
         needs `apple-mobile-web-app-capable` for full-screen standalone mode
         on older iOS versions, so we keep BOTH for backwards compatibility —
         newer browsers prefer the unprefixed `mobile-web-app-capable`. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MAVERO" />
    <meta name="description" content="MAVERO — Movies, series & anime, all in one place." />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/mavero-192.png" />
    <link rel="apple-touch-icon" href="/icons/mavero-apple-touch.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <script>
      // Newtask §6 — touch-capable Mac detection (iPad-as-Mac).
      //
      // iPads in default desktop mode ship a Macintosh User-Agent, so the
      // server cannot distinguish them from a desktop Mac by UA alone. This
      // inline script runs BEFORE hydration and sets a purely DESCRIPTIVE
      // hint cookie on the first visit; every subsequent server render
      // (including the device_sessions registry) classifies the device as
      // a tablet.
      //
      // Privacy/safety: the value is a static string ("tablet") — no PII,
      // no fingerprinting, no identifiers. It is never an authentication
      // credential and never used for access control. Cookie flags:
      // path=/, 1 year, SameSite=Lax (readable only by this origin over
      // the same-site requests the server handles).
      (function () {
        try {
          if (
            document.cookie.indexOf('mavero:device-hint=') === -1 &&
            navigator.maxTouchPoints > 1 &&
            navigator.platform === 'MacIntel'
          ) {
            document.cookie = 'mavero:device-hint=tablet; path=/; max-age=31536000; samesite=lax';
          }
        } catch (e) {
          /* descriptive only — never block rendering */
        }
      })();
    </script>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
