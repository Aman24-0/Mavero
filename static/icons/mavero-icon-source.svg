<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Subtle white-to-off-white gradient for the M (depth without color) -->
    <linearGradient id="mGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <!-- Dark glass background — near-black with very subtle center lift -->
    <radialGradient id="bgGlass" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="70%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <!-- Clip for rounded square -->
    <clipPath id="bgClip">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!--
    Mavero App Icon — Dark Glass + Custom White M

    Matches the actual Mavero product UI:
      - Near-black / charcoal background (#050505 → #111111)
      - White / off-white M (#f5f5f5 → #d0d0d0)
      - No purple, no neon, no glow, no play triangle
      - Custom geometric M built from two bold interlocking bands
      - Strong silhouette readable at 16px
      - All content within 80% maskable safe zone

    The M is the sole brand symbol — no text, no tagline, no play motif.
    The icon looks native next to Mavero's white logo, white Play
    buttons, and dark glass navigation.
  -->
  <g clip-path="url(#bgClip)">
    <!-- Dark glass background fills entire viewBox (maskable-safe) -->
    <rect x="0" y="0" width="512" height="512" fill="url(#bgGlass)"/>

    <!-- Subtle inner border (very restrained, not a bright outline) -->
    <rect x="1" y="1" width="510" height="510" rx="111" ry="111"
      fill="none" stroke="#1a1a1a" stroke-width="2" opacity="0.6"/>

    <!--
      Custom geometric M — two bold interlocking bands.
      Left leg (back): bottom-left → top-peak → center-valley.
      Right leg (front): bottom-right → top-peak → center-valley,
      crossing in front of the left leg at the V for a 3D ribbon fold.
      Both legs use the same white gradient — depth comes from the
      overlap, not from different colors.

      Band width ~55px for strong 16px silhouette.
      M spans x=140→372, y=140→380 — centered within 80% safe zone.
    -->
    <path
      d="M 140 380
         L 140 140
         L 256 230
         L 256 305
         L 195 265
         L 195 380
         Z"
      fill="url(#mGradient)"
    />
    <path
      d="M 372 380
         L 372 140
         L 256 230
         L 256 305
         L 317 265
         L 317 380
         Z"
      fill="url(#mGradient)"
    />

    <!-- Very subtle top-edge highlight (barely visible, adds depth
         without glow). Does NOT affect silhouette at small sizes. -->
    <path
      d="M 140 140 L 256 230 L 372 140"
      fill="none"
      stroke="#ffffff"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.25"
    />
  </g>
</svg>
