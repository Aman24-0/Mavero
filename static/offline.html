<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06060a" />
    <title>Mavero — Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #06060a; color: #f5f6fa; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: radial-gradient(circle at 70% 20%, rgba(255, 90, 122, .16), transparent 42%), #06060a; }
      main { width: min(100%, 460px); padding: 30px; border: 1px solid rgba(245, 246, 250, .12); border-radius: 22px; background: rgba(16, 16, 24, .86); box-shadow: 0 24px 80px rgba(0,0,0,.35); text-align: center; }
      img { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 20px; }
      p { color: rgba(245, 246, 250, .68); line-height: 1.6; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 18px; border-radius: 999px; color: #fff; background: linear-gradient(110deg, #ff3e5e, #9b65ff); font-weight: 800; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/mavero-192.png" alt="Mavero" width="64" height="64" />
      <h1>You’re offline.</h1>
      <p>Mavero’s app shell is ready, but this page needs a network connection. Reconnect and try again.</p>
      <a href="/discover">Try again</a>
    </main>
  </body>
</html>
