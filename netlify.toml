[build]
  command = "pnpm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    # Phase 3-I (audit SEC-CSP): Content-Security-Policy.
    #
    # A conservative CSP that protects against the highest-impact XSS
    # vectors WITHOUT breaking Mavero's existing functionality:
    #
    #   * script-src 'self' 'unsafe-inline' — SvelteKit production builds
    #     hash inline scripts, but the dev server + some client hydration
    #     paths use inline scripts. 'unsafe-inline' is required for
    #     SvelteKit compatibility (SvelteKit does not currently emit
    #     per-request nonces by default).
    #   * style-src 'self' 'unsafe-inline' — Tailwind CSS v4 + Svelte
    #     component styles are inlined.
    #   * img-src 'self' data: https://image.tmdb.org — TMDB poster/backdrop
    #     images. `data:` for inline SVG placeholders.
    #   * media-src 'self' https://zcdn.bluevelvet.space — direct HLS media
    #     elements (<video src>) for the Blue Velvet direct source (MAV-BV-
    #     PLAYBACK, 2026-10-12). Without an explicit media-src the directive
    #     falls back to default-src 'self', which REJECTS the provider's
    #     cross-origin media URLs before the browser ever attempts the load
    #     (verified live: "Loading media from 'https://zcdn.bluevelvet.space/…'
    #     violates … default-src 'self'"). Native-HLS browsers (Safari/iOS,
    #     Android Chromium) load media elements WITHOUT CORS, so this single
    #     directive is what makes the source playable there once the resolver
    #     gates permit it. The origin is the adapter's fixed HTTPS constant,
    #     never user input.
    #   * font-src 'self' — no external font CDN.
    #   * connect-src 'self' — the SvelteKit app talks to itself + the
    #     Supabase URL (which is on the SAME origin when proxied, or
    #     configured via PUBLIC_SUPABASE_URL — see note below).
    #     https://zcdn.bluevelvet.space is REQUIRED for the Blue Velvet direct
    #     HLS source on browsers WITHOUT native HLS (desktop Chrome/Firefox):
    #     hls.js loads manifests/segments via XHR/fetch, which is governed by
    #     connect-src (verified live: "Connecting to 'https://zcdn.bluevelvet
    #     .space/…' violates … connect-src"). Media elements on native-HLS
    #     browsers are governed by media-src above, not connect-src.
    #   * frame-src * — provider embeds (vidsrc, vidlink, cineverse, etc.)
    #     are ADMIN-CONFIGURED. A static allowlist would break playback
    #     every time an admin adds a new provider. The permissive frame-src
    #     is the safe tradeoff: the CSP still protects against XSS in
    #     scripts/styles/images, but doesn't break the embed-based playback
    #     architecture.
    #   * frame-ancestors 'none' — nobody can iframe Mavero (X-Frame-Options
    #     DENY already enforces this; the CSP is defense in depth).
    #   * object-src 'none' — no Flash/Java/plugins.
    #   * base-uri 'self' — no <base> injection.
    #   * form-action 'self' — no form submission to external origins.
    #
    # NOTE on connect-src: when the Supabase URL is on a DIFFERENT origin
    # (the common case — Supabase is a hosted service), the browser's
    # fetch() calls to that URL would be blocked by `connect-src 'self'`.
    # We CANNOT add the Supabase URL to connect-src here because:
    #   1. netlify.toml is static — we don't know the customer's Supabase
    #      URL at build time (different deployments use different Supabase
    #      projects);
    #   2. the Supabase URL is ALREADY public (baked into the client bundle
    #      via PUBLIC_SUPABASE_URL), so adding it to the CSP reveals nothing
    #      new — but we'd have to template the netlify.toml, which is out
    #      of scope for Phase 3.
    # The mitigation: the Supabase client uses fetch() to the Supabase URL,
    # which IS subject to connect-src. To avoid breaking auth, we use
    # `connect-src 'self' https://*.supabase.co` — the wildcard covers all
    # hosted Supabase projects (the common case). Self-hosted Supabase
    # deployments would need to add their URL here.
    #
    # NOTE on the player's optional lookups (Player V2 final remediation,
    # 2026-10-13): the external-subtitle LIST fetch (external-subtitles.ts)
    # and the TheIntroDB lookup (intro-client.ts) are BROWSER-DIRECT fetches
    # to fixed HTTPS origins:
    #   * https://sub.vdrk.site   — VDRK subtitle lists (the VTT FILES go
    #     through the same-origin /api/content/subtitles/vtt proxy and need
    #     no entry here);
    #   * https://api.theintrodb.org — TheIntroDB public read-only API.
    # Both were MISSING from connect-src, so the deployed CSP rejected the
    # requests before they left the page ("Refused to connect … violates
    # content security directive: connect-src") — every title showed
    # "No subtitles available"/"Subtitles unavailable" and Skip Intro could
    # never load, regardless of the upstream data (verified live 2026-10-13:
    # the VDRK upstreams are populated for the reported titles). The origins
    # are the adapters' fixed HTTPS constants (never user input) and carry
    # no credentials — adding them reveals nothing new.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; media-src 'self' https://zcdn.bluevelvet.space; font-src 'self'; connect-src 'self' https://*.supabase.co https://image.tmdb.org https://zcdn.bluevelvet.space https://sub.vdrk.site https://api.theintrodb.org; frame-src *; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    cache-control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
    # Focused favicon audit fix (2026-10): the manifest MUST be served
    # with the application/manifest+json content type. Without it,
    # Netlify falls back to application/octet-stream (verified live),
    # which some browsers/PWA validators reject as a malformed manifest
    # — affecting installability + PWA detection. The MIME type is the
    # IANA-registered value per RFC 9239.
    content-type = "application/manifest+json"

# Focused favicon audit fix (2026-10): the favicon assets (the new
# /favicon.ico plus the existing /icons/* PNGs) are immutable brand
# assets — they change only on a brand refresh. Cache them for a year
# at the edge so the second visit is instant and Googlebot's repeat
# crawls (which happen frequently during the favicon recrawl window)
# return 304s. The .ico is multi-resolution (16/32/48) so every
# crawler context (desktop browser tab, Android home screen, Google
# Search result) gets the right size.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
    content-type = "image/x-icon"

[[headers]]
  for = "/icons/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
