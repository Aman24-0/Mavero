# Mavero TV — build MaveroTV.wgt: the FULL Mavero UI as a static SPA.
#
# ARCHITECTURE (Stage 1 of the TV plan):
#   The web app is server-rendered (adapter-netlify, 55 +page.server.ts
#   loads, 104 +server.ts endpoints) — a .wgt has NO server. With
#   BUILD_TARGET=wgt, apps/web/svelte.config.js swaps to
#   @sveltejs/adapter-static (fallback index.html) and
#   apps/web/scripts/wgt_spa_prepare.mjs physically moves the server
#   route modules out of src/routes for the duration of the build — a
#   stub would not suffice, because SvelteKit generates its route
#   manifest from the FILES on disk and the client router would request
#   <url>/__data.json on hydration (impossible on the widget's file://
#   origin). The TV pages fetch their data from the deployed production
#   API (https://maveroweb.space/api/…) instead (Stage 2, page by page).
#
#   scripts/wgt_patch_shell.mjs then patches the BUILT shell (pack-time
#   injection only — the production HTML is never touched):
#     1. rewrites ABSOLUTE asset paths ("/_app/…, href="/…) to relative
#        (./_app/…, href="./…) — the widget runs from a file:// origin where
#        absolute paths resolve against the filesystem ROOT (blank grey
#        screen); the workflow asserts no "/_app/ reference survives;
#     2. CLASSIC BOOT — ES modules are BLOCKED on the TV's file:// origin
#        (TV-verified via the on-screen boot overlay): the build ships ONE
#        classic IIFE bundle (app.js — svelte.config.js bundleStrategy
#        'single' + vite.config.ts mavero-wgt-classic-bundle plugin), the
#        patcher replaces SvelteKit's module bootstrap with a plain classic
#        script that installs the kit payload/env global inline and boots
#        app.js via <script src="./app.js" defer>, strips every
#        modulepreload link, injects the merged stylesheet link, and
#        removes the Umami Cloud loader (its ES2020 syntax SyntaxErrors on
#        the Tizen 6.0 engine); the workflow asserts none of it survives;
#     3. injects a boot script that rewrites the widget's /index.html entry
#        URL to the package root before the client router boots;
#     4. injects on-screen boot diagnostics ("Mavero booting…" banner +
#        full-screen error overlay for onerror/unhandledrejection/resource
#        load errors) — a retail TV has no devtools, so every boot failure
#        must be readable ON the screen;
#     5. writes the classic ES5-safe polyfill.js (wgt_polyfill.js) to the
#        widget ROOT and loads it with a CLASSIC SYNC <script> BEFORE app.js
#        — esbuild downlevels syntax but NOT built-ins, and the TV engine
#        (Chromium 69-76) lacks the ES2021/ES2022 APIs the bundle calls
#        (TV overlay: "Object.hasOwn is not a function" → cascade "classic
#        bundle did not expose __mavero_wgt_app.start()"). The workflow
#        asserts polyfill.js is at the zip root, loads before app.js, and
#        defines the APIs the TV lacks.
#
#   After packing, a Playwright boot smoke runs the ACTUAL packed .wgt over
#   file:// with the TV-era built-ins DELETED (page.addInitScript — desktop
#   Chromium has those APIs, so without deletion it would never reproduce
#   the TV failure) and asserts: polyfill executed, __mavero_wgt_app.start
#   exposed, NO boot overlay, sidebar + discover body rendered.
#
# PACKING: the SPA output + the working config.xml + icon.png are copied
#   into a staging directory and packed with the OFFICIAL Tizen Studio
#   CLI (tizen-core, `tz`) — the same toolchain that fixed [118, -19]:
#   it schema-validates the manifest and writes the signature skeletons
#   a Tizen package manager expects (Apps2Samsung re-signs with the real
#   certificate). config.xml stays UNTOUCHED (MaveroTV01.MaveroTV /
#   package MaveroTV01).
#
# The result is published as a build artifact AND attached to the rolling
# "wgt-latest" release (GitHub caches release assets — verify with a
# cache-buster ?v=<timestamp> query).
#
# workflow_dispatch input `pack: poc` packs the original apps/tizen-wgt
# AVPlay PoC instead (the proven <object type="application/avplayer">
# reference implementation) — useful for TV-side debugging comparisons.
#
# The production web app is NEVER touched: BUILD_TARGET is unset on
# Netlify, so its adapter, output and semantics are unchanged.

name: Build WGT

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/tizen-wgt/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-wgt.yml"
  workflow_dispatch:
    inputs:
      pack:
        description: "What to pack into MaveroTV.wgt"
        type: choice
        default: "spa"
        options:
          - spa
          - poc

permissions:
  contents: write

concurrency:
  group: build-wgt-${{ github.ref }}
  cancel-in-progress: true

env:
  TIZEN_STUDIO_VERSION: "6.1"
  TIZEN_STUDIO_DIR: /home/runner/tizen-studio
  # The SPA shell build runs adapter-static's fallback generator, which
  # renders the root route through hooks.server.ts — and the hooks FAIL
  # CLOSED (intentional 503) when the Supabase public env is missing.
  # Nothing on the shell's render path performs a real Supabase call (the
  # server route modules are stashed), so placeholders are sufficient and
  # stay local to this job. Stage 2 replaces these with the real public
  # values via repo secrets (the anon key is public-by-design).
  WGT_BUILD_PUBLIC_SUPABASE_URL: https://wgt-build-placeholder.supabase.co
  WGT_BUILD_PUBLIC_SUPABASE_KEY: wgt-build-placeholder-anon-key

jobs:
  build-wgt:
    name: build · pack · verify · publish MaveroTV.wgt
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Tizen Studio (web-cli)
        id: tizen-cache
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/tizen-studio
            /home/runner/tizen-studio-data
            /home/runner/.package-manager
          key: tizen-webcli-${{ env.TIZEN_STUDIO_VERSION }}

      - name: Install Tizen Studio web-cli (headless)
        if: steps.tizen-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/web-cli.bin \
            "http://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VERSION}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VERSION}_ubuntu-64.bin"
          bash /tmp/web-cli.bin --accept-license --no-java-check "${TIZEN_STUDIO_DIR}"

      # The first package-manager run syncs the SDK components (the base
      # installer leaves tools/tizen-core/tz pending until it runs; "Nothing
      # to install" afterwards is expected and harmless).
      - name: Sync SDK components (package-manager-cli)
        run: |
          set -euo pipefail
          "${TIZEN_STUDIO_DIR}/package-manager/package-manager-cli.bin" \
            install --accept-license --no-java-check TOOLS
          test -x "${TIZEN_STUDIO_DIR}/tools/tizen-core/tz" || {
            echo "tizen-core (tz) missing after sync"; exit 1; }

      # ---------------- SPA path (default) ----------------

      - name: Setup pnpm 10.30.3 (the packageManager pin from package.json)
        if: github.event.inputs.pack != 'poc'
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Setup Node 22 (netlify.toml NODE_VERSION)
        if: github.event.inputs.pack != 'poc'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        if: github.event.inputs.pack != 'poc'
        run: pnpm install --frozen-lockfile

      - name: Build the static SPA (BUILD_TARGET=wgt)
        if: github.event.inputs.pack != 'poc'
        working-directory: apps/web
        env:
          BUILD_TARGET: wgt
          PUBLIC_SUPABASE_URL: ${{ env.WGT_BUILD_PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.WGT_BUILD_PUBLIC_SUPABASE_KEY }}
        run: |
          set -euo pipefail
          # Move the server route modules out of src/routes so the generated
          # manifest is a TRUE static-SPA manifest (see script header), and
          # restore them even when the build fails (EXIT trap).
          node scripts/wgt_spa_prepare.mjs stash
          trap 'node scripts/wgt_spa_prepare.mjs restore' EXIT
          pnpm exec svelte-kit sync
          pnpm exec vite build
          trap - EXIT
          node scripts/wgt_spa_prepare.mjs restore
          # Sanity: the SPA shell + client bundle must exist.
          test -f build/index.html || { echo "build/index.html missing"; exit 1; }
          test -d build/_app/immutable || { echo "build/_app/immutable missing"; exit 1; }
          # TV boot patch: normalize the widget's /index.html entry URL to
          # the package root before the SvelteKit router boots (pack-time
          # injection ONLY — the production HTML is never touched).
          node scripts/wgt_patch_shell.mjs build/index.html
          # HOP 1 — after patch: the stylesheet link MUST be present in the
          # patched build/index.html. Print the count + the actual tag so CI
          # logs show exactly what the patcher injected.
          echo "=== HOP 1: after patch (build/index.html) ==="
          echo "stylesheet count: $(grep -c 'rel="stylesheet"' build/index.html)"
          grep -o '<link rel="stylesheet"[^>]*>' build/index.html || echo "(no stylesheet tag found)"

      - name: Stage the widget tree (SPA output + working manifest)
        if: github.event.inputs.pack != 'poc'
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/wgt-stage/MaveroTV"
          rm -rf "${RUNNER_TEMP}/wgt-stage"
          mkdir -p "$STAGE"
          # The SPA output CONTENTS go to the stage ROOT (config.xml must
          # sit next to index.html).
          cp -a apps/web/build/. "$STAGE"/
          # The working, TV-accepted manifest + icon — UNTOUCHED.
          cp apps/tizen-wgt/config.xml apps/tizen-wgt/icon.png "$STAGE"/
          # HOP 2 — after stage copy: the stylesheet link MUST survive the
          # cp -a. Print the count + the actual tag so CI logs show exactly
          # what landed in the stage tree.
          echo "=== HOP 2: after stage copy ($STAGE/index.html) ==="
          echo "stylesheet count: $(grep -c 'rel="stylesheet"' "$STAGE"/index.html)"
          grep -o '<link rel="stylesheet"[^>]*>' "$STAGE"/index.html || echo "(no stylesheet tag found)"
          # HARD GUARD: the staged index.html MUST contain a relative
          # stylesheet link pointing at ./_app/immutable/assets/*.css.
          # This catches the CSS-link-loss bug at the EARLIEST hop (before
          # tz build/pack), not at the final verify step. Do NOT weaken.
          grep -q 'rel="stylesheet" href="./_app/immutable/assets/.*\.css"' "$STAGE"/index.html || {
            echo "HARD GUARD FAILED: staged index.html has no relative stylesheet link (./_app/immutable/assets/*.css) — aborting before pack"; exit 1; }
          echo "HARD GUARD: staged index.html has the relative stylesheet link — OK"
          # Packaging manifest for tizen-core: enumerate every file of the
          # built SPA (relative paths) so the pack includes the full bundle,
          # and carry the battle-tested excludes — tz build copies the
          # project into Debug/ while it runs, so Debug/* MUST stay
          # excluded or the copy recurses into its own output.
          #
          # FIX (build-wgt CSS-link-loss): the Python previously ran at the
          # REPO ROOT (the step's default working-directory), so
          # tizen_web_project.yaml was written to the repo root (NOT $STAGE)
          # and os.walk('.') walked the ENTIRE repo. Now we cd into $STAGE
          # first so the manifest enumerates ONLY the staged SPA files and
          # is written to $STAGE where tz build/pack can find it.
          cd "$STAGE"
          python3 - <<'PY'
          import os
          SKIP_DIRS = {'Debug', '.result', 'Build', 'Release', '.Build'}
          SKIP_FILES = {'tizen_web_project.yaml'}
          entries = []
          for root, dirs, names in os.walk('.'):
              dirs[:] = sorted(d for d in dirs if d not in SKIP_DIRS)
              for n in sorted(names):
                  if n in SKIP_FILES or n == 'config.xml':
                      continue
                  entries.append(os.path.relpath(os.path.join(root, n), '.').replace(os.sep, '/'))
          excludes = [
              'Build/*', 'Debug/*', 'Directory.Build.targets', 'Release/*', 'Test/*',
              '\\.Build/.*', '\\.buildResult/.*', '\\.csproj', '\\.externalToolBuilders/.*',
              '\\.gn', '\\.obj/.*', '\\.package/.*', '\\.project', '\\.rds_delta',
              '\\.sdk_delta.info', '\\.settings/.*', '\\.sign/.*',
              '\\.tizen-ui-builder-tool.xml', '\\.tproject', '\\.wgt',
              'tizen_web_project.yaml', 'webUnitTest/*', '\\.gitignore'
          ]
          lines = [
              '# GENERATED at pack time by .github/workflows/build-wgt.yml.',
              'project_type: web_app',
              'profile: tv',
              'api_version: "2.3"',
              'build_type: Debug',
              'output_name: MaveroTV',
              'excludes:'
          ]
          lines += [f'  - {e}' for e in excludes]
          lines += ['files:']
          lines += [f'  - {e}' for e in sorted(entries)]
          open('tizen_web_project.yaml', 'w').write('\n'.join(lines) + '\n')
          print(f'packaging manifest: {len(entries)} files + excludes')
          PY
          echo "STAGE_DIR=$STAGE" >> "$GITHUB_ENV"

      - name: Build + pack MaveroTV.wgt (official tizen-core CLI)
        if: github.event.inputs.pack != 'poc'
        run: |
          set -euo pipefail
          TZ_BIN="${TIZEN_STUDIO_DIR}/tools/tizen-core/tz"
          cd "$STAGE_DIR"
          rm -rf Debug .result
          # Schema-validates config.xml (profile tv) and builds the app.
          "$TZ_BIN" build .
          # GUARD: tz build copies the project into Debug/. The patched
          # index.html (with the relative stylesheet link) MUST survive the
          # copy. If tz build overwrites or regenerates index.html, this
          # guard catches it BEFORE pack — the earliest possible point.
          echo "=== HOP 2b: after tz build (Debug/index.html) ==="
          echo "stylesheet count: $(grep -c 'rel="stylesheet"' Debug/index.html)"
          grep -o '<link rel="stylesheet"[^>]*>' Debug/index.html || echo "(no stylesheet tag found)"
          grep -q 'rel="stylesheet" href="./_app/immutable/assets/.*\.css"' Debug/index.html || {
            echo "GUARD FAILED: Debug/index.html (after tz build) has no relative stylesheet link — tz build stripped it"; exit 1; }
          echo "GUARD: Debug/index.html has the relative stylesheet link — OK"
          # Packs the build result and signs it with the SDK dummy certs
          # (Apps2Samsung re-signs with the real Samsung certificate).
          "$TZ_BIN" pack .
          WGT=$(find Debug -maxdepth 1 -name '*.wgt' | head -1)
          test -n "$WGT" || { echo "no .wgt produced by tz pack"; exit 1; }
          mv "$WGT" "$GITHUB_WORKSPACE/MaveroTV.wgt"

      # ---------------- PoC path (workflow_dispatch pack=poc) ----------------

      - name: Build + pack MaveroTV.wgt (PoC — apps/tizen-wgt)
        if: github.event.inputs.pack == 'poc'
        run: |
          set -euo pipefail
          TZ_BIN="${TIZEN_STUDIO_DIR}/tools/tizen-core/tz"
          cd apps/tizen-wgt
          test -f config.xml || { echo "config.xml missing"; exit 1; }
          rm -rf Debug
          "$TZ_BIN" build .
          "$TZ_BIN" pack .
          WGT=$(find Debug -maxdepth 1 -name '*.wgt' | head -1)
          test -n "$WGT" || { echo "no .wgt produced by tz pack"; exit 1; }
          mv "$WGT" "$GITHUB_WORKSPACE/MaveroTV.wgt"

      # ---------------- Verification + publish ----------------

      - name: Verify MaveroTV.wgt structure
        run: |
          set -euo pipefail
          echo "--- MaveroTV.wgt contents ---"
          unzip -l MaveroTV.wgt
          # config.xml MUST be at the zip root
          unzip -Z1 MaveroTV.wgt | grep -qx 'config.xml' || {
            echo "config.xml is not at the zip root — aborting"; exit 1; }
          # The signature skeletons the TV's package manager expects
          unzip -Z1 MaveroTV.wgt | grep -qx 'author-signature.xml' || {
            echo "author-signature.xml missing — aborting"; exit 1; }
          unzip -Z1 MaveroTV.wgt | grep -qx 'signature1.xml' || {
            echo "signature1.xml missing — aborting"; exit 1; }
          # The manifest the TV will parse: the tv-profile schema requires
          # package = [0-9a-zA-Z]{10} and id = <package>.<AppName> (the
          # dotted ids are exactly what produced [118, -19] before).
          # NOTE: tz writes paired tags (<tizen:application ...>...</tizen:application>),
          # so match the OPENING tag up to the first '>' (both tag forms).
          grep -o '<tizen:application[^>]*>' <(unzip -p MaveroTV.wgt config.xml) | tee /tmp/tizen-application.txt
          grep -q 'package="MaveroTV01"' /tmp/tizen-application.txt
          grep -q 'id="MaveroTV01.MaveroTV"' /tmp/tizen-application.txt
          # The manifest must still be schema-valid XML
          python3 - <<'PY'
          import zipfile
          import xml.etree.ElementTree as ET  # stdlib — runners have no lxml
          z = zipfile.ZipFile('MaveroTV.wgt')
          ET.fromstring(z.read('config.xml'))
          print('config.xml parses as XML: OK')
          PY

      - name: Verify the SPA payload (SPA pack only)
        if: github.event.inputs.pack != 'poc'
        run: |
          set -euo pipefail
          # The SvelteKit SPA shell + client bundle must be inside the wgt.
          unzip -Z1 MaveroTV.wgt | grep -qx 'index.html' || {
            echo "index.html missing from the widget — aborting"; exit 1; }
          APP_ENTRIES=$(unzip -Z1 MaveroTV.wgt | grep -c '_app/immutable/')
          echo "_app/immutable entries: $APP_ENTRIES"
          test "$APP_ENTRIES" -gt 0 || { echo "SPA client bundle missing — aborting"; exit 1; }
          # The TV boot patch must be present in the packed shell.
          unzip -p MaveroTV.wgt index.html | grep -q 'mavero-wgt-boot' || {
            echo "boot URL-normalization script missing from the packed shell — aborting"; exit 1; }
          # The classic IIFE bundle must be at the widget root.
          unzip -Z1 MaveroTV.wgt | grep -qx 'app.js' || {
            echo "app.js (classic IIFE bundle) missing from the widget root — aborting"; exit 1; }
          # The built-in-API polyfill must be at the widget root (esbuild
          # downlevels SYNTAX only — the TV's ES2021/2022 built-ins are
          # missing: "Object.hasOwn is not a function" killed the bundle at
          # module evaluation, TV overlay-verified).
          unzip -Z1 MaveroTV.wgt | grep -qx 'polyfill.js' || {
            echo "polyfill.js missing from the widget root — aborting"; exit 1; }
          unzip -p MaveroTV.wgt polyfill.js > "${RUNNER_TEMP}/mavero-polyfill.js"
          test -s "${RUNNER_TEMP}/mavero-polyfill.js" || {
            echo "polyfill.js in the widget is empty — aborting"; exit 1; }
          grep -q 'Object.hasOwn' "${RUNNER_TEMP}/mavero-polyfill.js" || {
            echo "polyfill.js does not define Object.hasOwn — the TV boot crash would persist; aborting"; exit 1; }
          grep -q 'String.prototype.replaceAll' "${RUNNER_TEMP}/mavero-polyfill.js" || {
            echo 'polyfill.js does not define String.prototype.replaceAll — aborting'; exit 1; }
          grep -q 'WeakRef' "${RUNNER_TEMP}/mavero-polyfill.js" || {
            echo 'polyfill.js does not define a WeakRef shim — aborting'; exit 1; }
          grep -q 'Object.fromEntries' "${RUNNER_TEMP}/mavero-polyfill.js" || {
            echo 'polyfill.js does not define Object.fromEntries — aborting'; exit 1; }
          # ------------------------------------------------------------------
          # file:// boot safety — ES modules are BLOCKED on the TV. The Tizen
          # web engine refuses type="module" scripts, dynamic import() and
          # modulepreload links from the widget's null origin (TV-verified
          # via the on-screen boot overlay). The widget must therefore boot
          # from ONE classic IIFE bundle (app.js) via a plain classic script
          # tag, with the kit payload/env global installed inline first.
          # ------------------------------------------------------------------
          SHELL_HTML=$(unzip -p MaveroTV.wgt index.html)
          # HOP 3 — from the packed wgt: print the stylesheet count + the
          # actual tag so CI logs show exactly what survived into the wgt.
          echo "=== HOP 3: from the packed wgt (MaveroTV.wgt index.html) ==="
          echo "stylesheet count: $(echo "$SHELL_HTML" | grep -c 'rel="stylesheet"')"
          echo "$SHELL_HTML" | grep -o '<link rel="stylesheet"[^>]*>' || echo "(no stylesheet tag found)"
          # … the classic boot tag is present …
          echo "$SHELL_HTML" | grep -q 'src="./app.js" defer' || {
            echo 'packed shell has no classic <script src="./app.js" defer> boot tag; aborting'; exit 1; }
          # … the polyfill loads as a CLASSIC SYNC script BEFORE the bundle
          # (byte-offset ordering — every polyfilled global must exist before
          # the IIFE evaluates, the exact point where the TV crashed).
          POLY_OFFSET=$(echo "$SHELL_HTML" | grep -bo 'src="./polyfill.js"' | head -1 | cut -d: -f1)
          APP_OFFSET=$(echo "$SHELL_HTML" | grep -bo 'src="./app.js" defer' | head -1 | cut -d: -f1)
          test -n "$POLY_OFFSET" || {
            echo 'packed shell has no <script src="./polyfill.js"> tag — the polyfill would never load; aborting'; exit 1; }
          test -n "$APP_OFFSET" || {
            echo 'packed shell has no <script src="./app.js" defer> tag — aborting'; exit 1; }
          if [ "$POLY_OFFSET" -ge "$APP_OFFSET" ]; then
            echo "polyfill tag (offset $POLY_OFFSET) is not BEFORE the bundle tag (offset $APP_OFFSET) — the globals would be missing at module evaluation; aborting"
            exit 1
          fi
          echo "polyfill loads before the bundle: offset $POLY_OFFSET < $APP_OFFSET OK"
          # … the kit payload/env global is installed by the classic boot script …
          echo "$SHELL_HTML" | grep -q 'window.__sveltekit_' || {
            echo 'packed shell does not install the window.__sveltekit_<hash> env global; aborting'; exit 1; }
          # … the boot script calls the bundle through the IIFE global …
          echo "$SHELL_HTML" | grep -q '__mavero_wgt_app' || {
            echo 'packed shell boot script does not call the bundle via the __mavero_wgt_app IIFE global; aborting'; exit 1; }
          # … a relative stylesheet link exists (cssCodeSplit is off; the
          # merged asset must be linked explicitly) …
          echo "$SHELL_HTML" | grep -q 'href="./_app/immutable/assets/.*\.css"' || {
            echo 'packed shell has no relative stylesheet link (./_app/immutable/assets/*.css) — the TV would boot unstyled; aborting'; exit 1; }
          # … and NOTHING module-flavoured survives in the shell.
          if echo "$SHELL_HTML" | grep -qi 'type="module"'; then
            echo 'a type="module" script is still present in the packed shell — ES modules are blocked on the TV (file:// origin); aborting'; exit 1
          fi
          if echo "$SHELL_HTML" | grep -Fq 'import(' ; then
            echo 'a dynamic import( is still present in the packed shell — blocked on the TV (file:// origin); aborting'; exit 1
          fi
          if echo "$SHELL_HTML" | grep -q 'modulepreload'; then
            echo 'a modulepreload link is still present in the packed shell — refused on the TV (file:// origin); aborting'; exit 1
          fi
          # The classic bundle itself must be free of module syntax.
          unzip -p MaveroTV.wgt app.js > "${RUNNER_TEMP}/mavero-app-bundle.js"
          if grep -Fq 'import(' "${RUNNER_TEMP}/mavero-app-bundle.js"; then
            echo 'the IIFE bundle still contains import( — it would SyntaxError as a classic script on the TV; aborting'; exit 1
          fi
          if grep -Fq 'import.meta' "${RUNNER_TEMP}/mavero-app-bundle.js"; then
            echo 'the IIFE bundle still contains import.meta — invalid outside ES modules on the TV; aborting'; exit 1
          fi
          # Analytics must never ship to the TV: the Umami loader SyntaxErrors
          # on the Tizen 6.0 engine (TV-verified via the boot overlay) and a
          # null-origin widget cannot beacon anything anyway.
          if echo "$SHELL_HTML" | grep -Fq 'cloud.umami.is'; then
            echo 'the Umami Cloud loader survived in the packed shell — it SyntaxErrors on the TV engine; aborting'; exit 1
          fi
          # Relative asset references present …
          echo "$SHELL_HTML" | grep -q 'href="./_app/' || {
            echo 'packed shell has no relative href="./_app/…" — absolute asset paths would 404 on the TV (file:// origin); aborting'; exit 1; }
          # … and NO absolute "/_app/ (or '/_app/) references survive.
          if echo "$SHELL_HTML" | grep -Fq '"/_app/'; then
            echo 'absolute "/_app/ reference still present in the packed shell — blank grey screen on the TV; aborting'; exit 1
          fi
          if echo "$SHELL_HTML" | grep -Fq "'/_app/"; then
            echo "absolute '/_app/ reference still present in the packed shell — blank grey screen on the TV; aborting"; exit 1
          fi
          # No root-relative href/src attribute left (favicon, manifest, icons…).
          # -P (PCRE) needed for the (?!/) negative lookahead (grep -E has none).
          if echo "$SHELL_HTML" | grep -Pq '(href|src)="/((?!/).)'; then
            echo 'root-relative href="/…" or src="/…" attribute still present in the packed shell; aborting'; exit 1
          fi
          # On-screen boot diagnostics (retail TV: no devtools, no sdb logs).
          echo "$SHELL_HTML" | grep -q 'mavero-wgt-boot-overlay' || {
            echo 'boot-error overlay missing from the packed shell — aborting'; exit 1; }
          echo "$SHELL_HTML" | grep -q 'mavero-wgt-boot-banner' || {
            echo 'boot banner ("Mavero booting…") missing from the packed shell — aborting'; exit 1; }
          echo "file:// boot safety checks: OK"
          ls -la MaveroTV.wgt

      - name: Boot smoke on file:// with a TV-era engine (Playwright)
        if: github.event.inputs.pack != 'poc'
        run: |
          set -euo pipefail
          # Same toolchain pin as ci.yml (playwright@1.57.0 — see the ci.yml
          # runner-pin comment before bumping).
          npm install -g playwright@1.57.0
          playwright install --with-deps chromium
          # Boots the ACTUAL packed artifact over file:// with the TV-era
          # built-ins deleted (page.addInitScript) — desktop Chromium has
          # them, so without the deletion this smoke can never reproduce the
          # TV failure ("Object.hasOwn is not a function" → "classic bundle
          # did not expose __mavero_wgt_app.start()").
          node apps/web/scripts/wgt_file_smoke.mjs MaveroTV.wgt

      - name: Stage-2 verify — real data over file:// (TV-era engine)
        if: github.event.inputs.pack != 'poc'
        run: |
          set -euo pipefail
          # Proves the Stage-2 data wiring on the packed artifact: the fetch
          # bridge installs, the widget reaches the production API
          # (/api/tv/home), real TMDB content renders, the empty state is
          # gone. DATA-tier assertions tolerate the Netlify deploy of the
          # Stage-2 CORS headers still being in flight (same-push race);
          # re-run with --strict post-deploy to gate on the full contract.
          node apps/web/scripts/wgt_stage2_verify.mjs MaveroTV.wgt

      - name: Upload .wgt artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaveroTV-wgt
          path: MaveroTV.wgt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to rolling release (direct .wgt download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view wgt-latest >/dev/null 2>&1 || \
            gh release create wgt-latest \
              --title "Mavero TV (.wgt) — latest" \
              --notes "Auto-built from the repo at ${{ github.sha }}."
          gh release upload wgt-latest MaveroTV.wgt --clobber
          echo "Direct download:"
          echo "https://github.com/${{ github.repository }}/releases/download/wgt-latest/MaveroTV.wgt"
