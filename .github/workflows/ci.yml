name: CI

# CI quality gates for every change to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-gates:
    name: Check / Test / Build (Node 22, pnpm 10.30.3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: "Enable corepack (packageManager pin: pnpm@10.30.3)"
        run: corepack enable

      - name: Verify pinned pnpm version
        run: |
          version="$(corepack pnpm --version)"
          echo "pnpm ${version}"
          if [ "${version}" != "10.30.3" ]; then
            echo "::error::pnpm version mismatch — expected 10.30.3 (package.json packageManager pin), got ${version}"
            exit 1
          fi

      - name: Install root dependencies (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Type and Svelte validation (pnpm check)
        run: corepack pnpm check

      - name: Install ffmpeg (real binary required by some test suites)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test suites (pnpm test)
        run: corepack pnpm test

      - name: Production build (pnpm build)
        run: corepack pnpm build
